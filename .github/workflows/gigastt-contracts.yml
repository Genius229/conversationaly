name: GigaSTT contracts

on:
  workflow_dispatch:
  push:
    branches: [feat/gigastt-post-transcription]
    paths:
      - 'frontend/src-tauri/src/audio/post_transcription/**'
      - 'frontend/src-tauri/src/onboarding*.rs'
      - 'frontend/src-tauri/src/lib.rs'
      - 'frontend/src-tauri/src/installer_shutdown.rs'
      - 'frontend/src-tauri/installer/**'
      - 'frontend/src-tauri/tests/**'
      - 'frontend/src-tauri/migrations/**'
      - 'tools/gigastt-contract-tests/**'
      - '.github/workflows/gigastt-contracts.yml'
  pull_request:
    paths:
      - 'frontend/src-tauri/src/audio/post_transcription/**'
      - 'frontend/src-tauri/src/onboarding*.rs'
      - 'frontend/src-tauri/src/lib.rs'
      - 'frontend/src-tauri/src/installer_shutdown.rs'
      - 'frontend/src-tauri/installer/**'
      - 'frontend/src-tauri/tests/**'
      - 'frontend/src-tauri/migrations/**'
      - 'tools/gigastt-contract-tests/**'
      - '.github/workflows/gigastt-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gigastt-contract-tests -> target
      - name: Test production modules against owned fake processes
        run: cargo test --manifest-path tools/gigastt-contract-tests/Cargo.toml --locked --features gigastt-test-fixtures --no-fail-fast
      - name: Verify pinned installer ordering and configuration contracts
        run: python -m unittest discover -s frontend/src-tauri/installer/tests -v
      - name: Repeat Windows cancelled-probe lifecycle regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            Write-Host "Cancelled-probe regression $attempt/20"
            cargo test --manifest-path tools/gigastt-contract-tests/Cargo.toml --locked --features gigastt-test-fixtures --test gigastt_sidecar readiness_timeout_fails_and_reaps_the_child -- --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Clippy
        run: cargo clippy --manifest-path tools/gigastt-contract-tests/Cargo.toml --locked --features gigastt-test-fixtures --all-targets -- -D warnings
