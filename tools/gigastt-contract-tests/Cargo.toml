[package]
name = "gigastt-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Exercise the production modules without Tauri/GTK or native inference builds.
[workspace]

[[test]]
name = "post_transcription_finalization"
path = "../../frontend/src-tauri/tests/post_transcription_finalization.rs"

[[test]]
name = "post_transcription_preview"
path = "../../frontend/src-tauri/tests/post_transcription_preview.rs"

[features]
gigastt-test-fixtures = []

[[test]]
name = "post_transcription_job_state"
path = "../../frontend/src-tauri/tests/post_transcription_job_state.rs"

[[test]]
name = "post_transcription_import_audio"
path = "../../frontend/src-tauri/tests/post_transcription_import_audio.rs"

[[test]]
name = "post_transcription_command_contract"
path = "../../frontend/src-tauri/tests/post_transcription_command_contract.rs"

[lib]
name = "app_lib"
path = "lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[[test]]
name = "post_transcription_client"
path = "../../frontend/src-tauri/tests/post_transcription_client.rs"

[[test]]
name = "gigastt_sidecar"
path = "../../frontend/src-tauri/tests/gigastt_sidecar.rs"

[[bin]]
name = "fake-gigastt"
path = "../../frontend/src-tauri/tests/support/fake_gigastt.rs"

[[test]]
name = "post_transcription_audio"
path = "../../frontend/src-tauri/tests/post_transcription_audio.rs"

[[test]]
name = "post_transcription_import"
path = "../../frontend/src-tauri/tests/post_transcription_import.rs"

[[test]]
name = "post_transcription_service"
path = "../../frontend/src-tauri/tests/post_transcription_service.rs"

[[test]]
name = "post_transcription_models"
path = "../../frontend/src-tauri/tests/post_transcription_models.rs"
required-features = ["gigastt-test-fixtures"]
